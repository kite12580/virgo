name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: make zip mingw-w64-i686-gcc
          suppress-deprecation-warnings: msystem-mingw32
      - run: make CC=gcc
      - run: zip virgo.zip virgo.exe
      - uses: actions/upload-artifact@v5
        with:
          name: virgo
          path: virgo.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: virgo.zip
          generate_release_notes: true
